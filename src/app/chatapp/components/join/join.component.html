<!-- eslint-disable @angular-eslint/template/interactive-supports-focus -->
<!-- eslint-disable @angular-eslint/template/click-events-have-key-events -->
@if (chatPreview()) {
<div class="bg-[#00000014] left-0 top-0 min-w-screen min-h-screen fixed">
    <div
        class="bg-white w-1/2 h-1/2 m-auto -translate-y-1/2 mt-[50vh] relative p-2.5 rounded-2xl flex flex-row justify-between">
        <div class="flex flex-col justify-between">
            Join To The {{chatPreview()!.name}} Chat
            <br>
            Description:
            <br>
            {{chatPreview()!.description}}
            <div class="flex flex-row gap-1.5">

                <button type="button"
                    class="p-2.5 font-bold bg-amber-400 text-amber-950 rounded-2xl cursor-pointer self-start"
                    (click)="acceptInvite()">Accept</button>
                <button type="button"
                    class="p-2.5 font-bold bg-amber-900 text-amber-50 rounded-2xl cursor-pointer self-start"
                    (click)="closeWindow()">Decline</button>
            </div>
        </div>
    </div>
</div>
}
