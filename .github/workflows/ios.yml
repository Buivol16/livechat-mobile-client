name: Build iOS

on:
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npx cap add ios
      - run: npx cap sync ios

      - name: Build unsigned iPhone IPA
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/ios-device" \
            CODE_SIGNING_ALLOWED=NO \
            build

          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/ios-device/Build/Products/Release-iphoneos/App.app" \
            "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          zip -qry LiveChat-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ios-device-unsigned
          path: ${{ runner.temp }}/ipa/LiveChat-unsigned.ipa
